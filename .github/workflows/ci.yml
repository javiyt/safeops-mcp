name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go test ./... -coverprofile=coverage.out
      - uses: golangci/golangci-lint-action@v9
      - run: GOOS=linux GOARCH=amd64 go build ./cmd/safeops-mcp ./cmd/safeops-executor ./cmd/safeopsctl
      - run: GOOS=linux GOARCH=arm64 go build ./cmd/safeops-mcp ./cmd/safeops-executor ./cmd/safeopsctl
      - run: go run ./cmd/safeopsctl validate-config --config configs/config.example.yaml
      - name: Basic secret scan
        run: |
          ! grep -RInE --exclude-dir=.git '(AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' .
      - name: Forbidden execution patterns
        run: |
          ! grep -RInE --exclude-dir=.git 's[h][[:space:]]+-c|b[a]sh[[:space:]]+-c|(^|[^[:alnum:]_])e[v]al([^[:alnum:]_]|$)|exec\.Command\("s[h]"|exec\.Command\("b[a]sh"|NOPASSWD:[[:space:]]*ALL' .
      - name: Forbidden container operations
        run: |
          ! grep -RInE --include='*.go' --include='*.yml' --include='*.yaml' --exclude-dir=.git 'podman[[:space:]]+(exec|rm|rmi|prune|pull|run|create|generate|kube)|/run/podman/podman\.sock|/run/user/.*/podman/podman\.sock|D[O]CKER_HOST|C[O]NTAINER_HOST' .
