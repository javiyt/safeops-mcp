server:
  name: host-alpha
identity:
  administrator_id: safeops
database:
  path: /var/lib/safeops/safeops.db
socket:
  path: /run/safeops/safeops.sock
  group: safeops
  mode: "0660"
policies:
  default: deny
  destructive_actions: deny
  approval_expiration: 5m
  dry_run: false
limits:
  operation_timeout: 15s
  max_log_lines: 200
  max_tool_output_bytes: 65536
  max_healthcheck_attempts: 5
filesystem:
  disk_paths:
    root:
      path: /
diagnostics:
  cpu:
    load_warning: 2.0
    load_critical: 4.0
    temperature_warning: 70
    temperature_critical: 80
  memory:
    available_warning_percent: 15
    available_critical_percent: 5
    swap_warning: 50
    oom_check: true
  disk:
    usage_warning: 80
    usage_critical: 90
    inode_warning: 80
    inode_critical: 90
    smart_check: false
  network:
    ping_targets:
      - "8.8.8.8"
      - "1.1.1.1"
    latency_warning: 100ms
    redact_ips: false
  time:
    ntp_check: true
    drift_warning: 1s
alerts:
  enabled: false
  interval: 30s
  cooldown: 5m
  persistence_threshold: 30s
  notify_resolution: true
  retention: 720h
  telegram:
    enabled: false
    chat_id: 12345678
  silence_schedule:
    - start: "02:00"
      end: "06:00"
      timezone: "Europe/Madrid"
  checks:
    services:
      enabled: true
      interval: 30s
    containers:
      enabled: true
      interval: 30s
    disk:
      enabled: true
      interval: 1m
      warning: 80
      critical: 90
    memory:
      enabled: true
      interval: 1m
      pressure_warning: 0.5
      pressure_critical: 0.8
    cpu:
      enabled: true
      interval: 1m
      load_warning: 2.0
      load_critical: 4.0
      temperature_warning: 70
      temperature_critical: 80
    sqlite:
      enabled: true
      interval: 1m
    executor:
      enabled: true
      interval: 30s
    app_errors:
      enabled: true
      interval: 1m
      pattern: "ERROR|FATAL"
      threshold: 5
    certificates:
      enabled: false
      interval: 1h
      warning_days: 30
      critical_days: 7
    backups:
      enabled: false
      interval: 1h
      max_age: 24h
telegram:
  enabled: false
  token_env: SAFEOPS_TELEGRAM_TOKEN
  allowed_users:
    - 12345678
  admin_id: 12345678
  rate_limit:
    messages_per_minute: 10
  message_size_limit: 4096
  confirmation:
    code_length: 4
    expiration_seconds: 300
  buttons:
    enabled: true
  openclaw:
    command: /usr/local/bin/openclaw
    args: ["run", "--agent", "safeops-agent"]
    timeout: 30s
podman:
  enabled: true
  binary: /usr/bin/podman
  mode: rootless
  systemd_scope: user
services:
  service-alpha:
    unit: app-alpha.service
    permissions:
      status: allow
      logs: allow
      restart: confirm
    healthcheck:
      url: http://127.0.0.1:8080/health
      timeout: 3s
      attempts: 5
      interval: 2s
  service-beta:
    unit: another-process.service
    permissions:
      status: allow
      logs: allow
      restart: confirm
  db-service:
    unit: db-service.service
    permissions:
      status: allow
      logs: allow
      restart: deny
containers:
  container-alpha:
    container_name: app-alpha-container
    management: podman
    permissions:
      status: allow
      logs: allow
      restart: confirm
    logs:
      max_lines: 200
    health:
      require_healthy_after_restart: true
      attempts: 5
      interval: 2s
  workload-alpha:
    container_name: worker-alpha-container
    management: quadlet
    quadlet_unit: worker-alpha.service
    permissions:
      status: allow
      logs: allow
      restart: confirm
    health:
      require_healthy_after_restart: false
  container-gamma:
    container_name: database-container
    management: podman
    permissions:
      status: allow
      logs: allow
      restart: deny
