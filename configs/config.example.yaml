server:
  name: host-alpha
identity:
  administrator_id: safeops
database:
  path: /var/lib/safeops/safeops.db
socket:
  path: /run/safeops/safeops.sock
  group: safeops
  mode: "0660"
policies:
  default: deny
  destructive_actions: deny
  approval_expiration: 5m
  dry_run: false
limits:
  operation_timeout: 15s
  max_log_lines: 200
  max_tool_output_bytes: 65536
  max_healthcheck_attempts: 5
filesystem:
  disk_paths:
    root:
      path: /
telegram:
  enabled: false
  token_env: SAFEOPS_TELEGRAM_TOKEN
  allowed_users:
    - 12345678
  admin_id: 12345678
  rate_limit:
    messages_per_minute: 10
  message_size_limit: 4096
  confirmation:
    code_length: 4
    expiration_seconds: 300
  buttons:
    enabled: true
  openclaw:
    command: /usr/local/bin/openclaw
    args: ["run", "--agent", "safeops-agent"]
    timeout: 30s
podman:
  enabled: true
  binary: /usr/bin/podman
  mode: rootless
  systemd_scope: user
services:
  service-alpha:
    unit: app-alpha.service
    permissions:
      status: allow
      logs: allow
      restart: confirm
    healthcheck:
      url: http://127.0.0.1:8080/health
      timeout: 3s
      attempts: 5
      interval: 2s
  service-beta:
    unit: another-process.service
    permissions:
      status: allow
      logs: allow
      restart: confirm
  database-alpha:
    unit: database-alpha.service
    permissions:
      status: allow
      logs: allow
      restart: deny
containers:
  container-alpha:
    container_name: app-alpha-container
    management: podman
    permissions:
      status: allow
      logs: allow
      restart: confirm
    logs:
      max_lines: 200
    health:
      require_healthy_after_restart: true
      attempts: 5
      interval: 2s
  workload-alpha:
    container_name: worker-alpha-container
    management: quadlet
    quadlet_unit: worker-alpha.service
    permissions:
      status: allow
      logs: allow
      restart: confirm
    health:
      require_healthy_after_restart: false
  container-gamma:
    container_name: datastore-alpha-container
    management: podman
    permissions:
      status: allow
      logs: allow
      restart: deny
